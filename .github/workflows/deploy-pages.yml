name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'jira-dashboard/**'
      - 'scripts/export_jira_for_pages.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: jira-dashboard/package-lock.json

      - name: Install & build dashboard
        working-directory: jira-dashboard
        env:
          VITE_BASE_PATH: /QA_Bug_DashBoard/
          VITE_STATIC_MODE: 'true'
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: jira-dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
