name: Sync Jira Data

on:
  schedule:
    # Same as BIOAT dashboard — refresh every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Export Jira bugs to static JSON
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_PERSONAL_TOKEN: ${{ secrets.JIRA_PERSONAL_TOKEN }}
        run: |
          python scripts/export_jira_for_pages.py
          python scripts/export_jira_releases_for_pages.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jira-dashboard/public/data/jira-bugs.json jira-dashboard/public/data/jira-releases.json
          git diff --staged --quiet || git commit -m "chore: sync Jira bug and release data"
          git push
