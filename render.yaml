services:
  - type: web
    name: qa-bug-dashboard-api
    runtime: node
    rootDir: jira-dashboard
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JIRA_PROJECT
        value: BIIH
      - key: JIRA_RELEASE_PROJECT
        value: BIIH
      - key: CORS_ORIGIN
        value: https://yashwanth-iqvia.github.io
      - key: JIRA_URL
        sync: false
      - key: JIRA_PERSONAL_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
